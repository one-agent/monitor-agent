# Spring Boot Configuration
server.port=8081
spring.application.name=monitor-agent

# AgentScope Configuration
agentscope.llm.api-key=${LLM_API_KEY:}
agentscope.llm.base-url=${LLM_BASE_URL:https://router.shengsuanyun.com/api/v1}
agentscope.llm.model-name=${LLM_MODEL_NAME:ali/qwen3-vl-plus}
agentscope.llm.temperature=0.7
agentscope.llm.max-tokens=2000
agentscope.llm.stream=true

# AgentScope Embedding Configuration (for RAG)
agentscope.embedding.api-key=${EMBEDDING_API_KEY:}
agentscope.embedding.base-url=${EMBEDDING_BASE_URL:https://router.shengsuanyun.com/api/v1}
agentscope.embedding.model-name=${EMBEDDING_MODEL_NAME:openai/text-embedding-3-small}
agentscope.embedding.enabled=true
#agentscope.embedding.dimensions=1024

# Logging
logging.level.root=INFO
logging.level.com.oneagent.monitor=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Feishu Webhook Configuration
monitor.feishu.webhook-url=${FEISHU_WEBHOOK_URL:https://open.feishu.cn/open-apis/bot/v2/hook/placeholder}

# Apifox API Configuration
monitor.apifox.api-url=${APIFOX_API_URL:https://api.apifox.com}
monitor.apifox.api-token=${APIFOX_API_TOKEN:your-apifox-token-here}
monitor.apifox.project-id=${APIFOX_PROJECT_ID:your-project-id-here}
monitor.apifox.folder-id=${APIFOX_FOLDER_ID:}
monitor.apifox.module-id=${APIFOX_MODULE_ID:}

# Studio Configuration
# Enable Studio support
monitor.studio.enabled=false
# Studio server URL
monitor.studio.studio-url=http://localhost:3000
# Project name (for project identifier in Studio)
monitor.studio.project-name=MonitorAgent
# Run name (to distinguish different agents)
monitor.studio.run-name=demo_

# Uptime Kuma Configuration
# Enable Uptime Kuma integration
monitor.uptime-kuma.enabled=true
# Alert deduplication window in seconds
monitor.uptime-kuma.alert-dedupe-window=300
# Webhook secret (optional, for request validation)
monitor.uptime-kuma.webhook-secret=${UPTIME_KUMA_WEBHOOK_SECRET:2233}

# Log Alert Configuration (OpenTelemetry + Alertmanager)
# Enable log alert integration
monitor.log-alert.enabled=${LOG_ALERT_ENABLED:false}
# Webhook secret (optional, for request validation)
monitor.log-alert.webhook-secret=${LOG_ALERT_WEBHOOK_SECRET:4455}
# Alert deduplication window in seconds (based on error fingerprint)
monitor.log-alert.dedupe-window=${LOG_ALERT_DEDUPE_WINDOW:300}
# Minimum log level for alerts (ERROR, WARNING, INFO, DEBUG)
monitor.log-alert.min-level=${LOG_ALERT_MIN_LEVEL:ERROR}
# Alert keywords (comma-separated)
monitor.log-alert.keywords=${LOG_ALERT_KEYWORDS:Exception,Failed,Timeout,Error,Refused,Denied}
# Frequency threshold (optional, 0 means disabled)
monitor.log-alert.frequency-threshold=${LOG_ALERT_FREQUENCY_THRESHOLD:0}

# Fault History Configuration
# Storage method (apifox, memory)
monitor.fault-history.storage=apifox
# Maximum retention days
monitor.fault-history.max-days=${FAULT_HISTORY_MAX_DAYS:30}
# Maximum retention records
monitor.fault-history.max-records=${FAULT_HISTORY_MAX_RECORDS:1000}

# CORS Configuration
# Allowed origins (comma-separated)
# Use * to allow all origins, or specify origins like: http://localhost:5173,http://example.com
monitor.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}
